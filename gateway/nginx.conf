server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 64m;

    # Resolve `backend` per request through Docker's embedded DNS rather than
    # once at startup. A literal hostname in proxy_pass is resolved when nginx
    # loads its config and the address is kept for the life of the worker, so
    # recreating the backend container -- every `docker compose up --build` of
    # it -- gave it a new IP while the gateway kept proxying to the old one and
    # returned 504 until the gateway itself was restarted. Observed directly:
    # the gateway still targeting 172.19.0.6 after the backend moved to
    # 172.19.0.4. Using a variable in proxy_pass forces resolution through
    # `resolver`; valid=10s bounds how long a stale answer can live.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Operator console, served as static files from a read-only bind mount.
    #
    # Before this existed the gateway had a single `location /` proxying
    # everything to the backend, so the console was reachable only through
    # scripts/serve_dashboard.py -- a stdlib dev proxy that is not part of the
    # stack, has no healthcheck, and is in no verification gate. The console is
    # the component a human uses to authorise containment, so it belongs behind
    # the same ingress as the API it drives.
    location /console/ {
        alias /usr/share/nginx/porygon-console/;
        index index.html;
        try_files $uri $uri/ /console/index.html;

        # Mirrored in scripts/serve_dashboard.py::SECURITY_HEADERS so the dev
        # proxy and the gateway present an identical posture. verify_all.sh
        # static asserts the two agree.
        #
        # script-src 'self' is the control that matters: it is what stops a
        # compromised CDN, a hijacked DNS answer, or a republished package tag
        # from running code on the console origin and reading the operator
        # token out of storage. Every asset is local and hash-verified
        # (dashboard/vendor/integrity-manifest.json).
        #
        # 'unsafe-eval' is required because Alpine compiles directive
        # expressions such as x-show="activeTab==='overview'" with
        # new Function(). It permits evaluating strings already present in the
        # served markup -- reachable only via a separate HTML-injection defect
        # -- and does not re-admit third-party code.
        #
        # 'unsafe-inline' for style-src is required by Alpine's x-transition
        # and the :style bindings, which write element style attributes.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # A stale console bundle paired with a fresh integrity manifest fails
        # SRI and renders nothing, so the console is never cached.
        add_header Cache-Control "no-store" always;
    }

    location / {
        # No URI part, so the original request URI is passed through unchanged,
        # exactly as the literal `proxy_pass http://backend:8000;` did.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # API responses are data, never a document to render, and must not be
        # framed or sniffed into one.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}

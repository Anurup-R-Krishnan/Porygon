name: ${COMPOSE_PROJECT_NAME:-porygon}

services:
  postgres:
    labels:
      com.porygon.protected: "true"
    image: postgres:17.10-bookworm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - porygon_postgres_data:/var/lib/postgresql/data
    networks:
      - porygon_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  backend:
    labels:
      com.porygon.protected: "true"
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORYGON_DB_HOST: postgres
      PORYGON_DB_PORT: "5432"
      PORYGON_DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      PORYGON_DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PORYGON_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PORYGON_ENVIRONMENT: ${PORYGON_ENVIRONMENT:-development}
      PORYGON_LOG_LEVEL: ${PORYGON_LOG_LEVEL:-INFO}
      PORYGON_INTERNAL_API_TOKEN: ${PORYGON_INTERNAL_API_TOKEN:?PORYGON_INTERNAL_API_TOKEN is required}
      PORYGON_OPERATOR_API_TOKEN: ${PORYGON_OPERATOR_API_TOKEN:?PORYGON_OPERATOR_API_TOKEN is required}
      PORYGON_RESPONSE_EXECUTION_MODE: ${PORYGON_RESPONSE_EXECUTION_MODE:-disabled}
      PORYGON_RESPONSE_APPROVAL_MAX_AGE_SECONDS: ${PORYGON_RESPONSE_APPROVAL_MAX_AGE_SECONDS:-3600}
      PORYGON_PARENT_CORRELATION_LOOKBACK_SECONDS: ${PORYGON_PARENT_CORRELATION_LOOKBACK_SECONDS:-600}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - porygon_internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    labels:
      com.porygon.protected: "true"
    image: nginxinc/nginx-unprivileged:1.29.3-alpine-slim@sha256:df9d99123d80117ea348470175f20abe85befd1ed361ea6207eaf49ab5a30ed9
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8080"
    networks:
      - porygon_internal
      - porygon_ingress
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  collector:
    labels:
      com.porygon.protected: "true"
    build:
      context: ./collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORYGON_API_BASE_URL: http://backend:8000
      PORYGON_INTERNAL_API_TOKEN: ${PORYGON_INTERNAL_API_TOKEN:?PORYGON_INTERNAL_API_TOKEN is required}
      PORYGON_COLLECTOR_INSTANCE_ID: ${COLLECTOR_INSTANCE_ID:-local-collector-01}
      PORYGON_HEARTBEAT_INTERVAL_SECONDS: ${COLLECTOR_HEARTBEAT_INTERVAL_SECONDS:-10}
      PORYGON_ENVIRONMENT: ${PORYGON_ENVIRONMENT:-development}
      PORYGON_LOG_LEVEL: ${PORYGON_LOG_LEVEL:-INFO}
      PORYGON_DOCKER_BASE_URL: unix:///var/run/docker.sock
      PORYGON_DOCKER_HOST_ID: ${PORYGON_DOCKER_HOST_ID:-auto}
      PORYGON_DOCKER_TIMEOUT_SECONDS: ${PORYGON_DOCKER_TIMEOUT_SECONDS:-10}
      PORYGON_DOCKER_EVENT_WINDOW_SECONDS: ${PORYGON_DOCKER_EVENT_WINDOW_SECONDS:-15}
      PORYGON_DOCKER_EVENT_OVERLAP_SECONDS: ${PORYGON_DOCKER_EVENT_OVERLAP_SECONDS:-2}
      PORYGON_SPOOL_PATH: /var/lib/porygon/outbox.db
      PORYGON_SPOOL_MAX_EVENTS: ${PORYGON_SPOOL_MAX_EVENTS:-100000}
      PORYGON_DELIVERY_BATCH_SIZE: ${PORYGON_DELIVERY_BATCH_SIZE:-100}
      PORYGON_DELIVERY_POLL_SECONDS: ${PORYGON_DELIVERY_POLL_SECONDS:-1}
      PORYGON_DELIVERY_RETRY_MAX_SECONDS: ${PORYGON_DELIVERY_RETRY_MAX_SECONDS:-60}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - porygon_internal
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group ID owning the Docker socket}"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - porygon_collector_data:/var/lib/porygon
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  falco-events-init:
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    command:
      - sh
      - -ec
      - chown 0:10003 /var/log/porygon && chmod 0770 /var/log/porygon
    network_mode: none
    volumes:
      - porygon_falco_events:/var/log/porygon
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  telemetry:
    labels:
      com.porygon.protected: "true"
    build:
      context: ./telemetry
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORYGON_API_BASE_URL: http://backend:8000
      PORYGON_INTERNAL_API_TOKEN: ${PORYGON_INTERNAL_API_TOKEN:?PORYGON_INTERNAL_API_TOKEN is required}
      PORYGON_TELEMETRY_INSTANCE_ID: ${TELEMETRY_INSTANCE_ID:-local-falco-adapter-01}
      PORYGON_HEARTBEAT_INTERVAL_SECONDS: ${TELEMETRY_HEARTBEAT_INTERVAL_SECONDS:-10}
      PORYGON_ENVIRONMENT: ${PORYGON_ENVIRONMENT:-development}
      PORYGON_LOG_LEVEL: ${PORYGON_LOG_LEVEL:-INFO}
      PORYGON_DOCKER_HOST_ID: ${PORYGON_DOCKER_HOST_ID:-auto}
      PORYGON_FALCO_LOG_PATH: /var/log/porygon/falco-events.jsonl
      PORYGON_FALCO_POLL_SECONDS: ${PORYGON_FALCO_POLL_SECONDS:-0.25}
      PORYGON_FALCO_MAX_LINE_BYTES: ${PORYGON_FALCO_MAX_LINE_BYTES:-1048576}
      PORYGON_SPOOL_PATH: /var/lib/porygon/process-outbox.db
      PORYGON_SPOOL_MAX_EVENTS: ${PORYGON_PROCESS_SPOOL_MAX_EVENTS:-250000}
      PORYGON_DELIVERY_BATCH_SIZE: ${PORYGON_PROCESS_DELIVERY_BATCH_SIZE:-100}
      PORYGON_DELIVERY_POLL_SECONDS: ${PORYGON_PROCESS_DELIVERY_POLL_SECONDS:-1}
      PORYGON_DELIVERY_RETRY_MAX_SECONDS: ${PORYGON_PROCESS_DELIVERY_RETRY_MAX_SECONDS:-60}
      PORYGON_DEAD_LETTER_MAX_RECORDS: ${PORYGON_DEAD_LETTER_MAX_RECORDS:-1000}
      PORYGON_DEAD_LETTER_MAX_TOTAL_BYTES: ${PORYGON_DEAD_LETTER_MAX_TOTAL_BYTES:-1048576}
      PORYGON_DEAD_LETTER_EXCERPT_BYTES: ${PORYGON_DEAD_LETTER_EXCERPT_BYTES:-512}
      PORYGON_DEAD_LETTER_RETENTION_SECONDS: ${PORYGON_DEAD_LETTER_RETENTION_SECONDS:-604800}
    depends_on:
      backend:
        condition: service_healthy
      falco-events-init:
        condition: service_completed_successfully
    networks:
      - porygon_internal
    volumes:
      - porygon_falco_events:/var/log/porygon:ro
      - porygon_telemetry_data:/var/lib/porygon
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  responder:
    labels:
      com.porygon.protected: "true"
    build:
      context: ./responder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORYGON_API_BASE_URL: http://backend:8000
      PORYGON_INTERNAL_API_TOKEN: ${PORYGON_INTERNAL_API_TOKEN:?PORYGON_INTERNAL_API_TOKEN is required}
      PORYGON_RESPONDER_INSTANCE_ID: ${RESPONDER_INSTANCE_ID:-local-responder-01}
      PORYGON_HEARTBEAT_INTERVAL_SECONDS: ${RESPONDER_HEARTBEAT_INTERVAL_SECONDS:-10}
      PORYGON_POLL_SECONDS: ${PORYGON_RESPONSE_POLL_SECONDS:-1}
      PORYGON_LEASE_SECONDS: ${PORYGON_RESPONSE_LEASE_SECONDS:-30}
      PORYGON_DOCKER_BASE_URL: unix:///var/run/docker.sock
      PORYGON_DOCKER_TIMEOUT_SECONDS: ${PORYGON_DOCKER_TIMEOUT_SECONDS:-10}
      PORYGON_STOP_TIMEOUT_SECONDS: ${PORYGON_STOP_TIMEOUT_SECONDS:-10}
      PORYGON_PROTECTED_LABEL: com.porygon.protected
      PORYGON_ENVIRONMENT: ${PORYGON_ENVIRONMENT:-development}
      PORYGON_LOG_LEVEL: ${PORYGON_LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - porygon_internal
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group ID owning the Docker socket}"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  scanner:
    labels:
      com.porygon.protected: "true"
    build:
      context: ./scanner
      args:
        TRIVY_VERSION: ${PORYGON_TRIVY_VERSION:-0.72.0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORYGON_API_BASE_URL: http://backend:8000
      PORYGON_INTERNAL_API_TOKEN: ${PORYGON_INTERNAL_API_TOKEN:?PORYGON_INTERNAL_API_TOKEN is required}
      PORYGON_SCANNER_INSTANCE_ID: ${SCANNER_INSTANCE_ID:-local-trivy-scanner-01}
      PORYGON_HEARTBEAT_INTERVAL_SECONDS: ${SCANNER_HEARTBEAT_INTERVAL_SECONDS:-10}
      PORYGON_POLL_SECONDS: ${PORYGON_SCANNER_POLL_SECONDS:-2}
      PORYGON_LEASE_SECONDS: ${PORYGON_SCANNER_LEASE_SECONDS:-1800}
      PORYGON_DOCKER_BASE_URL: unix:///var/run/docker.sock
      PORYGON_DOCKER_TIMEOUT_SECONDS: ${PORYGON_DOCKER_TIMEOUT_SECONDS:-30}
      PORYGON_TRIVY_VERSION: ${PORYGON_TRIVY_VERSION:-0.72.0}
      PORYGON_TRIVY_CACHE_DIR: /var/lib/trivy
      PORYGON_TRIVY_TIMEOUT_SECONDS: ${PORYGON_TRIVY_TIMEOUT_SECONDS:-900}
      PORYGON_INTEL_TIMEOUT_SECONDS: ${PORYGON_INTEL_TIMEOUT_SECONDS:-30}
      PORYGON_INTEL_BATCH_SIZE: ${PORYGON_INTEL_BATCH_SIZE:-100}
      PORYGON_ENVIRONMENT: ${PORYGON_ENVIRONMENT:-development}
      PORYGON_LOG_LEVEL: ${PORYGON_LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - porygon_internal
      - porygon_egress
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group ID owning the Docker socket}"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - porygon_trivy_cache:/var/lib/trivy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  falco:
    labels:
      com.porygon.protected: "true"
    image: falcosecurity/falco:0.44.1
    restart: unless-stopped
    environment:
      HOST_ROOT: /host
    command:
      - falco
      - -U
      - -r
      - /etc/falco/porygon_rules.yaml
      - -o
      - engine.kind=modern_ebpf
      - -o
      - json_output=true
      - -o
      - json_include_output_fields=true
      - -o
      - time_format_iso_8601=true
      - -o
      - stdout_output.enabled=true
      - -o
      - file_output.enabled=true
      - -o
      - file_output.keep_alive=false
      - -o
      - file_output.filename=/var/log/porygon/falco-events.jsonl
      - -o
      - syslog_output.enabled=false
      - -o
      - webserver.enabled=true
    depends_on:
      falco-events-init:
        condition: service_completed_successfully
    volumes:
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/host/var/run/docker.sock:ro
      - ./falco/porygon_rules.yaml:/etc/falco/porygon_rules.yaml:ro
      - porygon_falco_events:/var/log/porygon
    networks:
      - porygon_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kill -0 1 && test -s /var/log/porygon/falco-events.jsonl",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - BPF
      - PERFMON
      - SYS_RESOURCE
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

networks:
  porygon_internal:
    driver: bridge
    internal: true
  porygon_ingress:
    driver: bridge
  porygon_egress:
    driver: bridge

volumes:
  porygon_postgres_data:
  porygon_collector_data:
  porygon_telemetry_data:
  porygon_falco_events:
  porygon_trivy_cache:

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "porygon-api"
version = "0.8.0"
description = "Porygon Phase 8 digest-bound SBOM and vulnerability enrichment API"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

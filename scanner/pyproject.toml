[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "porygon-scanner"
version = "0.8.0"
description = "Porygon Phase 8 digest-bound Trivy scanner and vulnerability-intelligence enricher"
requires-python = ">=3.13"
dependencies = [
  "docker==7.2.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pydantic-settings==2.14.2",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
